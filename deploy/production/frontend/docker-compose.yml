# PRODUCTION - frontend server 172.28.80.50 (nginx: pages + proxy to the backend).
#
# Run from this folder:   cp .env.example .env   (once, then check the values)
#                         docker compose up -d --build
# Users open:             http://172.28.80.50:3070/
#
# Settings come from .env next to this file; startup stops with a message if one is missing.
name: plantation-rainfall-prod-fe

services:
  frontend:
    build:
      context: ../../../frontend
    image: plantation-rainfall-frontend:production
    container_name: plantation-rainfall-frontend-production
    environment:
      # Backend server, private address and port (deploy/production/backend).
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in deploy/production/frontend/.env (copy .env.example)}
    ports:
      - "${FRONTEND_HOST_PORT:?Set FRONTEND_HOST_PORT in deploy/production/frontend/.env (copy .env.example)}:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
