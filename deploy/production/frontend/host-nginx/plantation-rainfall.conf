# PRODUCTION - site for the server's own nginx (Ubuntu package, ports 80/443) on the frontend
# server 172.28.80.50. It forwards http://plantation-rainfall.kpndomain.com to the dashboard's
# frontend container, which listens on 127.0.0.1:3070 only.
#
# Install (see docs/DEPLOYMENT_PRODUCTION.md, step 6.4: run its read-only pre-check first):
#   cp plantation-rainfall.conf /etc/nginx/sites-available/plantation-rainfall.conf
#   ln -s /etc/nginx/sites-available/plantation-rainfall.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Remove: rm /etc/nginx/sites-enabled/plantation-rainfall.conf && nginx -t && systemctl reload nginx

server {
    # Shared nginx (the DWS Hub and other apps have their own sites here). This block only
    # answers requests for its own name: no default_server, IPv4 only (an IPv6 listen that no
    # other site has would make this site the default for all IPv6 traffic on port 80).
    # If the other sites listen on 172.28.80.50:80 instead of 80, use the same form here.
    listen 80;
    server_name plantation-rainfall.kpndomain.com;

    access_log /var/log/nginx/plantation-rainfall.access.log;
    error_log  /var/log/nginx/plantation-rainfall.error.log;

    # Sign-in and admin requests are small; data responses are proxied, not uploaded.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        # The backend checks that the browser's Origin matches this Host (sign-in protection).
        proxy_set_header Host $host;
        # Overwrite (never append) the visitor address, so a browser cannot fake it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The All Regions data request can take a while right after a refresh.
        proxy_read_timeout 120s;
    }
}
