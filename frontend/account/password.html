<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password · Plantation Weather</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b2530'/%3E%3Cpath d='M16 5C12 11 9 14.5 9 18.5a7 7 0 0 0 14 0C23 14.5 20 11 16 5z' fill='%2371d7d0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header>
    <div><p class="eyebrow">Your account</p><h1>Change password</h1></div>
  </header>
  <main>
    <section class="panel account-panel">
      <form id="passwordForm" class="admin-form" novalidate>
        <label>Current password<input name="currentPassword" type="password" autocomplete="current-password" required></label>
        <label>New password<input name="newPassword" type="password" autocomplete="new-password" required></label>
        <label>Repeat new password<input name="repeatPassword" type="password" autocomplete="new-password" required></label>
        <p class="hint">Use a long password with letters and numbers. Your other signed-in sessions are signed out.</p>
        <div id="message" class="form-message" role="status" hidden></div>
        <button type="submit" class="primary">Change password</button>
      </form>
    </section>
  </main>
  <script src="/js/sidebar.js"></script>
  <script>
    document.getElementById('passwordForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.target, message = document.getElementById('message');
      const show = (text, ok) => { message.textContent = text; message.classList.toggle('ok', !!ok); message.hidden = false; };
      if (form.newPassword.value !== form.repeatPassword.value) return show('The new passwords do not match.');
      const response = await fetch('/api/me/password', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' },
        body: JSON.stringify({ currentPassword: form.currentPassword.value, newPassword: form.newPassword.value }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) return show(result.error || 'The password could not be changed.');
      form.reset();
      show('Your password has been changed.', true);
    });
  </script>
</body>
</html>
